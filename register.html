<!DOCTYPE html>
<html>
<head>
    <title>Donor Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Donor Registration</h2>

<form>
    Name: <input type="text"><br><br>
    Age: <input type="number"><br><br>

    Blood Group:
    <select>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
    </select><br><br>

    Phone Number: <input type="text"><br><br>
    Distance from Hospital (km): <input type="number"><br><br>
    Last Donation Date: <input type="date"><br><br>

    <button>Register</button>
</form>

<br>
<a href="index.html">Back to Home</a>

</body>
</html>
